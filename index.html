<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance Nutricional — Armonía y Vitalidad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--v:#1D9E75;--vl:#E1F5EE;--vd:#085041;--tm:#666;--tb:#e2e2df;--bg:#f7f7f4;--card:#fff}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:#1a1a1a;font-size:14px;line-height:1.6}
.app{max-width:900px;margin:0 auto;padding:28px 20px 60px}
.hdr{display:flex;align-items:center;gap:14px;margin-bottom:26px;padding-bottom:20px;border-bottom:1.5px solid var(--tb)}
.logo{width:44px;height:44px;background:var(--v);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.hdr h1{font-family:"DM Serif Display",serif;font-size:24px;color:var(--vd);line-height:1.2}
.hdr p{font-size:12px;color:var(--tm);margin-top:2px}
.sec{font-size:11px;font-weight:500;color:var(--tm);text-transform:uppercase;letter-spacing:.9px;margin-bottom:8px;margin-top:22px}
.perfiles{display:flex;gap:7px;flex-wrap:wrap}
.pb{padding:7px 15px;border:1px solid var(--tb);border-radius:20px;background:white;font-size:13px;font-family:"DM Sans",sans-serif;cursor:pointer;color:var(--tm);transition:all .18s}
.pb.on{background:var(--v);border-color:var(--v);color:white;font-weight:500}
.pb:hover:not(.on){border-color:var(--v);color:var(--v)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{padding:4px 12px;border-radius:10px;font-size:12px;font-weight:500}
.ck{background:var(--vl);color:var(--vd)}.cg{background:#FFF3E0;color:#BF360C}
.cp{background:#E3F2FD;color:#0D47A1}.cc{background:#F3E5F5;color:#4A148C}
.dia-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.dia-row label{font-size:13px;color:var(--tm)}
.dia-in{width:80px;padding:7px 10px;border:1px solid var(--tb);border-radius:7px;font-size:14px;font-family:"DM Sans",sans-serif;text-align:center}
.dia-in:focus{outline:none;border-color:var(--v)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
@media(max-width:580px){.cgrid{grid-template-columns:1fr}}
.cc-card{background:var(--card);border:1px solid var(--tb);border-radius:10px;padding:14px}
.cc-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cc-ico{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.cc-name{font-weight:500;font-size:13px}.cc-sum{font-size:11px;color:var(--v);margin-top:1px}
/* Campo nombre de receta */
.receta-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--tb)}
.receta-label{font-size:11px;color:var(--tm);white-space:nowrap;flex-shrink:0}
.receta-input{flex:1;padding:5px 8px;border:1px solid var(--tb);border-radius:5px;font-size:12px;font-family:"DM Sans",sans-serif;background:#fafafa;color:#1a1a1a;transition:border-color .18s}
.receta-input:focus{outline:none;border-color:var(--v);background:white}
.receta-input::placeholder{color:#bbb}
/* fin campo nombre */
.ir{display:flex;gap:5px;margin-bottom:6px;align-items:flex-start}
.ing-wrap{flex:1;position:relative;min-width:0}
.ing-search{width:100%;padding:5px 8px;border:1px solid var(--tb);border-radius:5px;font-size:12px;font-family:"DM Sans",sans-serif;background:white}
.ing-search:focus{outline:none;border-color:var(--v)}
.ing-dropdown{position:absolute;top:100%;left:0;right:0;background:white;border:1px solid var(--v);border-radius:5px;max-height:200px;overflow-y:auto;z-index:100;display:none;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.ing-dropdown.show{display:block}
.ing-opt{padding:6px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.ing-opt:hover{background:var(--vl);color:var(--vd)}
.ing-opt .cat-label{font-size:10px;color:var(--tm);display:block}
.ing-selected{font-size:11px;color:var(--v);margin-top:2px;font-style:italic}
.ig{width:70px;padding:5px 6px;border:1px solid var(--tb);border-radius:5px;font-size:12px;font-family:"DM Sans",sans-serif;text-align:right}
.ig:focus{outline:none;border-color:var(--v)}
.iu{font-size:11px;color:var(--tm);flex-shrink:0;padding-top:6px}
.ibtn-del{width:22px;height:22px;border:none;background:none;cursor:pointer;color:#ccc;font-size:15px;transition:color .15s;flex-shrink:0;padding-top:4px}
.ibtn-del:hover{color:#e53935}
.ibtn-add{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:5px 10px;border:1px dashed var(--tb);border-radius:5px;background:none;cursor:pointer;color:var(--tm);font-size:12px;font-family:"DM Sans",sans-serif;transition:all .18s}
.ibtn-add:hover{border-color:var(--v);color:var(--v)}
.tbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tc{background:white;border:1px solid var(--tb);border-radius:7px;padding:9px 10px;text-align:center}
.tv{font-size:18px;font-weight:500;color:var(--vd)}.tl{font-size:10px;color:var(--tm);margin-top:1px}
.alerta{font-size:12px;padding:8px 12px;border-radius:7px;margin-top:8px}
.ok{background:#E8F5E9;color:#2E7D32}.warn{background:#FFF3E0;color:#E65100}
.btn-gen{width:100%;margin-top:20px;padding:14px;background:var(--v);color:white;border:none;border-radius:10px;font-size:15px;font-weight:500;font-family:"DM Sans",sans-serif;cursor:pointer;transition:background .18s}
.btn-gen:hover{background:var(--vd)}
.btn-gen:disabled{background:#aaa;cursor:not-allowed}
.res{margin-top:22px;background:var(--card);border:1.5px solid var(--v);border-radius:10px;padding:20px}
.res-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.res-title{font-family:"DM Serif Display",serif;font-size:17px;color:var(--vd)}
.res-sub{font-size:12px;color:var(--tm);margin-top:3px}
.btn-cop{padding:8px 16px;border:1px solid var(--v);border-radius:7px;background:var(--vl);font-size:13px;font-family:"DM Sans",sans-serif;cursor:pointer;color:var(--vd);font-weight:500;transition:all .18s}
.btn-cop:hover{background:var(--v);color:white}
.balance-text{font-size:13.5px;line-height:1.9;color:#1a1a1a;white-space:pre-wrap;font-family:"DM Sans",sans-serif}
.ldot{display:inline-flex;gap:4px;margin-left:8px}
.ldot span{width:6px;height:6px;border-radius:50%;background:var(--v);animation:pulse .9s infinite both}
.ldot span:nth-child(2){animation-delay:.2s}
.ldot span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
/* Modal de confirmación */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-box{background:white;border-radius:12px;padding:24px 28px;max-width:420px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-title{font-family:"DM Serif Display",serif;font-size:16px;color:var(--vd);margin-bottom:10px}
.modal-body{font-size:13px;color:#333;line-height:1.7;margin-bottom:18px}
.modal-body ul{margin:8px 0 0 16px}
.modal-body li{margin-bottom:3px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.modal-btn{padding:8px 20px;border-radius:7px;font-size:13px;font-family:"DM Sans",sans-serif;font-weight:500;cursor:pointer;border:none;transition:all .18s}
.modal-btn.cancel{background:#f0f0ee;color:#555}.modal-btn.cancel:hover{background:#e0e0dd}
.modal-btn.confirm{background:var(--v);color:white}.modal-btn.confirm:hover{background:var(--vd)}
</style>
</head>

function setPerfil(k){
  perfil=k;
  document.querySelectorAll(".pb").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  renderChips();recalc();
}

function renderChips(){
  const p=PERFILES[perfil];
  document.getElementById("chips").innerHTML=
    `<span class="chip ck">Objetivo: ${p.k} kcal</span>`+
    `<span class="chip cg">Grasas ${p.g}%</span>`+
    `<span class="chip cp">Proteínas ${p.p}%</span>`+
    `<span class="chip cc">CH netos ${p.c}%</span>`;
}

function recalc(){
  let kc=0,gr=0,pr=0,ch=0,has=false;
  Object.values(data).forEach(com=>com.items.forEach(r=>{
    const ing=INGS.find(i=>i.n===r.n);
    if(!ing||!r.g)return;has=true;
    const f=r.g/100;
    kc+=(ing.g*9+ing.p*4+ing.c*4)*f;
    gr+=ing.g*f;pr+=ing.p*f;ch+=ing.c*f;
  }));
  const tb=document.getElementById("tbar"),al=document.getElementById("alerta");
  tb.style.display=has?"grid":"none";
  if(has){
    tb.innerHTML=
      `<div class="tc"><div class="tv">${kc.toFixed(2)}</div><div class="tl">kcal totales</div></div>`+
      `<div class="tc"><div class="tv">${gr.toFixed(2)}g</div><div class="tl">Grasas</div></div>`+
      `<div class="tc"><div class="tv">${pr.toFixed(2)}g</div><div class="tl">Proteínas</div></div>`+
      `<div class="tc"><div class="tv">${ch.toFixed(2)}g</div><div class="tl">CH netos</div></div>`;
    const p=PERFILES[perfil];
    const gP=kc>0?Math.round(gr*9/kc*100):0;
    const pP=kc>0?Math.round(pr*4/kc*100):0;
    const cP=kc>0?Math.round(ch*4/kc*100):0;
    const ok=Math.abs(gP-p.g)<=5&&Math.abs(pP-p.p)<=5&&Math.abs(cP-p.c)<=4;
    al.style.display="block";
    al.className="alerta "+(ok?"ok":"warn");
    al.textContent=ok
      ?`✓ Macros dentro del rango ${p.L}: G ${gP}% · P ${pP}% · CH ${cP}%`
      :`⚠ Macros actuales: G ${gP}% · P ${pP}% · CH ${cP}% — Objetivo: G ${p.g}% · P ${p.p}% · CH ${p.c}%`;
  }else al.style.display="none";
}

function makeSearch(comId,idx,selectedName){
  const wid=`sw_${comId}_${idx}`,did=`sd_${comId}_${idx}`,sid=`ss_${comId}_${idx}`;
  return `<div class="ing-wrap">
    <input id="${wid}" class="ing-search" type="text" placeholder="Escribe para buscar..." autocomplete="off"
      value="${selectedName||''}"
      oninput="filterIng('${comId}',${idx},this.value)"
      onfocus="filterIng('${comId}',${idx},this.value)"
      onblur="setTimeout(()=>hideDD('${did}'),200)">
    <div id="${did}" class="ing-dropdown"></div>
    <div id="${sid}" class="ing-selected">${selectedName?"✓ "+selectedName:""}</div>
  </div>`;
}

function filterIng(comId,idx,query){
  const did=`sd_${comId}_${idx}`,dd=document.getElementById(did);
  if(!query||query.length<1){dd.classList.remove("show");return;}
  const q=query.toLowerCase();
  const results=INGS.filter(i=>i.n.toLowerCase().includes(q)).slice(0,12);
  if(!results.length){dd.classList.remove("show");return;}
  dd.innerHTML=results.map(i=>
    `<div class="ing-opt" onmousedown="selectIng('${comId}',${idx},'${i.n.replace(/'/g,"\\'")}')">
      ${i.n}<span class="cat-label">${i.t}</span>
    </div>`).join("");
  dd.classList.add("show");
}

function hideDD(did){const dd=document.getElementById(did);if(dd)dd.classList.remove("show")}

function selectIng(comId,idx,name){
  data[comId].items[idx].n=name;
  document.getElementById(`sw_${comId}_${idx}`).value=name;
  document.getElementById(`ss_${comId}_${idx}`).textContent="✓ "+name;
  document.getElementById(`sd_${comId}_${idx}`).classList.remove("show");
  recalc();
}

function updReceta(comId,val){
  data[comId].receta=val;
}

function renderComidas(){
  const grid=document.getElementById("cgrid");grid.innerHTML="";
  COMIDAS.forEach(com=>{
    const rows=data[com.id].items;
    const recetaVal=data[com.id].receta||"";
    const filled=rows.filter(r=>r.n&&r.g>0);
    const sum=filled.length>0?filled.length+" ingrediente"+(filled.length>1?"s":"")+" añadido"+(filled.length>1?"s":""):"Sin ingredientes";

    let rh=rows.map((r,i)=>`
      <div class="ir">
        ${makeSearch(com.id,i,r.n)}
        <input class="ig" type="text" inputmode="decimal" value="${r.g||''}" placeholder="g"
          onchange="updG('${com.id}',${i},this.value)"
          oninput="updG('${com.id}',${i},this.value)">
        <span class="iu">g</span>
        <button class="ibtn-del" onclick="del('${com.id}',${i})">×</button>
      </div>`).join("");

    grid.innerHTML+=`
      <div class="cc-card">
        <div class="cc-head">
          <div class="cc-ico" style="background:${com.bg}">${com.ico}</div>
          <div><div class="cc-name">${com.L}</div><div class="cc-sum">${sum}</div></div>
        </div>
        <div class="receta-row">
          <span class="receta-label">Receta:</span>
          <input class="receta-input" type="text" placeholder="Nombre de la receta (opcional)"
            value="${recetaVal.replace(/"/g,'&quot;')}"
            oninput="updReceta('${com.id}',this.value)">
        </div>
        ${rh}
        <button class="ibtn-add" onclick="add('${com.id}')">+ Añadir ingrediente</button>
      </div>`;
  });
}

function add(com){data[com].items.push({n:"",g:0});renderComidas();recalc()}
function del(com,i){data[com].items.splice(i,1);renderComidas();recalc()}
function updG(com,i,v){const num=parseFloat(v.replace(",","."));data[com].items[i].g=isNaN(num)?0:num;recalc()}

// Comprueba si hay comidas con ingredientes pero sin nombre de receta
function comidasSinNombre(){
  return COMIDAS
    .filter(com=>{
      const tieneItems=data[com.id].items.some(r=>r.n&&r.g>0);
      const sinNombre=!data[com.id].receta.trim();
      return tieneItems && sinNombre;
    })
    .map(com=>com.L);
}

function buildResumen(){
  let lines=[];
  COMIDAS.forEach(com=>{
    const items=data[com.id].items.filter(r=>r.n&&r.g>0);
    if(!items.length)return;
    const nombreReceta=data[com.id].receta.trim();
    // En el resumen para la IA NO incluimos el nombre de receta (no es necesario para el balance)
    lines.push(`${com.L.toUpperCase()}:`);
    items.forEach(r=>{
      const ing=INGS.find(i=>i.n===r.n);
      if(ing){const f=r.g/100,kc=(ing.g*9+ing.p*4+ing.c*4)*f;
        lines.push(` • ${r.n}: ${r.g}g (${kc.toFixed(2)} kcal | P:${(ing.p*f).toFixed(2)}g · G:${(ing.g*f).toFixed(2)}g · CH:${(ing.c*f).toFixed(2)}g)`);}
    });
  });
  return lines.join("\n");
}

// buildResumen CON nombres de receta — para recetario
function buildResumenRecetario(soloComida){
  let lines=[];
  const lista = soloComida ? COMIDAS.filter(c=>c.id===soloComida) : COMIDAS;
  lista.forEach(com=>{
    const items=data[com.id].items.filter(r=>r.n&&r.g>0);
    if(!items.length)return;
    const nombreReceta=data[com.id].receta.trim();
    if(nombreReceta) lines.push(`${com.L.toUpperCase()}: ${nombreReceta}`);
    else lines.push(`${com.L.toUpperCase()}:`);
    items.forEach(r=>{
      const ing=INGS.find(i=>i.n===r.n);
      if(ing){const f=r.g/100,kc=(ing.g*9+ing.p*4+ing.c*4)*f;
        lines.push(` • ${r.n}: ${r.g}g (${kc.toFixed(2)} kcal | P:${(ing.p*f).toFixed(2)}g · G:${(ing.g*f).toFixed(2)}g · CH:${(ing.c*f).toFixed(2)}g)`);}
    });
  });
  return lines.join("\n");
}

function calcT(){
  let kc=0,gr=0,pr=0,ch=0;
  Object.values(data).forEach(com=>com.items.forEach(r=>{
    const ing=INGS.find(i=>i.n===r.n);
    if(!ing||!r.g)return;const f=r.g/100;
    kc+=(ing.g*9+ing.p*4+ing.c*4)*f;gr+=ing.g*f;pr+=ing.p*f;ch+=ing.c*f;
  }));
  const gP=kc>0?Math.round(gr*9/kc*100):0,pP=kc>0?Math.round(pr*4/kc*100):0,cP=kc>0?Math.round(ch*4/kc*100):0;
  return{kc:kc.toFixed(2),gr:gr.toFixed(2),pr:pr.toFixed(2),ch:ch.toFixed(2),gP,pP,cP};
}
